name: ⏰ Reminders

on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *' # every hour, 30 min past (offset from sync-drive/post)

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install automation deps
        working-directory: automation
        run: npm ci

      - name: Check reminders
        id: check
        working-directory: automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run reminders

      - name: Commit updated reminders
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: mark due reminders as notified'
          file_pattern: 'config/reminders.json'

      # The "Check reminders" step above opens a GitHub issue with the actual
      # message for anything due -- that's the primary notification now. This
      # step is only a backup: it fails the run (triggering GitHub's built-in
      # "workflow run failed" email -- Settings -> Notifications -> Actions
      # must have failure emails enabled) specifically when that issue itself
      # couldn't be opened (permissions problem, API hiccup), so you're never
      # silently missing a due reminder just because the nicer notification
      # failed to send.
      - name: Fail so GitHub sends a backup notification email
        if: steps.check.outputs.notify_failed == 'true'
        run: |
          echo "A reminder is due but its notification issue failed to open -- see the 'Check reminders' step log above for the message and the reason."
          exit 1
