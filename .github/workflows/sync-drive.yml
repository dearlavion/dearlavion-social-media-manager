name: Sync Drive images

on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: 'Force-sync only this channel id, ignoring its enabled flag'
        required: false
        type: string
  schedule:
    - cron: '0 * * * *' # every hour, on the hour (UTC)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install automation deps
        working-directory: automation
        run: npm ci

      - name: Sync new images from Google Drive
        working-directory: automation
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FORCE_CHANNEL_ID: ${{ github.event.inputs.channel_id }}
        run: npm run sync-drive

      - name: Commit synced images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync images from Google Drive'
          file_pattern: 'inbox/** config/channels.json'
