name: Post due channels

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Force-scope to only this project id'
        required: false
        type: string
      channel_id:
        description: 'Within that project, force-post only this channel id, ignoring its enabled flag and due-check'
        required: false
        type: string
  schedule:
    - cron: '15 * * * *' # every hour, 15 min after sync-drive (UTC)

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install automation deps
        working-directory: automation
        run: npm ci

      - name: Post any due channel
        working-directory: automation
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          FORCE_PROJECT_ID: ${{ github.event.inputs.project_id }}
          FORCE_CHANNEL_ID: ${{ github.event.inputs.channel_id }}
        run: npm run post

      # if: always() -- post.ts now catches a failing channel's publish error
      # and moves on to the next one instead of aborting, so other channels
      # in this same run can still have succeeded even if the npm script's
      # own exit code ends up non-zero because one of them failed.
      - name: Commit posted state
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: post due channel(s)'
          file_pattern: 'inbox/** posted/** config/**/channels.json'
