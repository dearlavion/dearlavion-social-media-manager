name: Post due channels

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *' # every hour, 15 min after sync-drive (UTC)

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install automation deps
        working-directory: automation
        run: npm ci

      - name: Post any due channel
        working-directory: automation
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: npm run post

      - name: Commit posted state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: post due channel(s)'
          file_pattern: 'inbox/** posted/** config/channels.json'
