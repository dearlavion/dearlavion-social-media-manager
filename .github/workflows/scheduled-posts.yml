name: 📅 Scheduled posts

on:
  workflow_dispatch:
  schedule:
    # Every 5 min, not hourly like the other workflows -- this is the one that
    # actually has to notice a specific target *time* passing (or fail to find
    # media and notify), so it stays close to real-time. Free on a public repo.
    - cron: '*/5 * * * *'

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install automation deps
        working-directory: automation
        run: npm ci

      - name: Publish due scheduled slots, notify on missing media
        id: check
        working-directory: automation
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run scheduled-posts

      # if: always() -- a publish failure is caught inside scheduled-posts.ts
      # itself (it moves on to the next slot rather than throwing), so this
      # step normally still runs regardless; always() is just a safety net
      # in case something outside that catch still crashes the script.
      - name: Commit posted state
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: scheduled post run'
          file_pattern: 'inbox/** posted/** config/**/campaigns.json config/**/channels.json'

      # Same pattern as reminders.yml: GitHub can't put custom text in its
      # own notification email, so this deliberately fails the run to
      # trigger GitHub's built-in "workflow run failed" email (Settings ->
      # Notifications -> Actions must have failure emails enabled) as a
      # fast, guaranteed signal. The step above also opens a GitHub issue
      # with the actual message, so you don't have to dig through this
      # run's log to read it.
      - name: Fail so GitHub sends a notification email
        if: steps.check.outputs.due == 'true'
        run: |
          echo "A scheduled post is due with no media linked -- see the step log above for which one."
          exit 1
