name: 📅 Scheduled posts

on:
  workflow_dispatch:
  schedule:
    # Every 5 min, not hourly like the other workflows -- this is the one that
    # actually has to notice a specific target *time* passing (or fail to find
    # media and notify), so it stays close to real-time. Free on a public repo.
    - cron: '*/5 * * * *'

permissions:
  contents: write
  issues: write

# Shared with post.yml -- see its comment. Runs here are normally short (well under a minute), so queuing
# behind a post.yml run costs little, and it's what actually prevents the two workflows from racing to
# publish the same inbox/ folder.
concurrency:
  group: automation-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install automation deps
        working-directory: automation
        run: npm ci

      - name: Publish due scheduled slots, notify on missing media
        id: check
        working-directory: automation
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run scheduled-posts

      # if: always() -- a publish failure is caught inside scheduled-posts.ts
      # itself (it moves on to the next slot rather than throwing), so this
      # step normally still runs regardless; always() is just a safety net
      # in case something outside that catch still crashes the script.
      - name: Commit posted state
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: scheduled post run'
          file_pattern: 'inbox/** posted/** config/**/campaigns.json config/**/channels.json'
          # -A is required: plain `git add <pattern>` (this action's default) only stages new/modified files,
          # never deletions. Without it, movePosted()'s inbox/ -> posted/ rename never gets its inbox/ side of
          # the move committed -- the old file stays tracked in git and comes back on every fresh checkout,
          # even though it's actually gone from disk. That silently caused the same post to be picked up and
          # published again by every subsequent run.
          add_options: '-A'

      # Same pattern as reminders.yml: the "Publish due scheduled slots" step
      # above opens a GitHub issue with the actual message for anything
      # overdue or that failed to publish -- that's the primary notification.
      # This step is only a backup: it fails the run (triggering GitHub's
      # built-in "workflow run failed" email -- Settings -> Notifications ->
      # Actions must have failure emails enabled) specifically when a
      # notification issue itself couldn't be opened, so you're never
      # silently missing something just because the nicer notification failed.
      - name: Fail so GitHub sends a backup notification email
        if: steps.check.outputs.notify_failed == 'true'
        run: |
          echo "A scheduled-post notification issue failed to open -- see the step log above for what happened and why."
          exit 1
